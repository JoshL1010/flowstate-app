<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="../media/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#F7F8F7;--ink:#080D10;--ink2:#525C5F;--ink3:#8A9396;--rule:#E2E6E2;
  --live:#0E6DB2;--raised:#FFF;--warn:#8A5A00;--warn-bg:#FFF6E5}
@media (prefers-color-scheme:dark){:root{--paper:#070B0D;--ink:#EDEFEB;--ink2:#98A2A5;
  --ink3:#667073;--rule:#1C2326;--live:#5CBBF2;--raised:#10161A;--warn:#F0C97A;--warn-bg:#2A2011}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--paper);color:var(--ink);padding:32px 22px;
  font-family:"Instrument Sans",ui-sans-serif,-apple-system,system-ui,sans-serif;
  font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{width:min(100%,560px)}
h1{margin:0 0 14px;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:600;letter-spacing:-.03em;
  line-height:1.1}
p{margin:0 0 16px;color:var(--ink2)}
.mono{font-family:"IBM Plex Mono",monospace}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px;font-weight:600;
  text-decoration:none;color:var(--ink);letter-spacing:-.02em}
.brand span{width:24px;height:24px;border-radius:6px;background-image:url("../media/icon.png");
  background-size:cover}
.card{background:var(--raised);border:1px solid var(--rule);border-radius:13px;padding:20px}
.licence{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.55;
  word-break:break-all;user-select:all;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);
  border:0;font:inherit;font-weight:600;font-size:15px;padding:12px 22px;border-radius:9px;
  text-decoration:none;cursor:pointer}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.note{font-size:13.5px;color:var(--ink3);margin-top:22px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:13px 15px;
  font-size:14px;margin-top:18px}
a{color:var(--live)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--rule);
  border-top-color:var(--live);border-radius:50%;animation:s .8s linear infinite;
  vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<title>Get FlowState Pro</title>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<main>
  <a class="brand" href="../"><span></span> FlowState</a>
  <div id="view" aria-live="polite">
    <h1><span class="spin"></span>Opening secure checkout…</h1>
    <p>Payment is handled by Paddle, who are the merchant of record for FlowState.</p>
  </div>
  <noscript><p>Checkout needs JavaScript. Enable it and reload, or email
    <a href="mailto:support@flowstatemac.com">support@flowstatemac.com</a>.</p></noscript>
</main>
<script>
(function(){
  var view = document.getElementById("view");
  var opening = false;

  function ready(detail) {
    opening = false;
    view.innerHTML = '<h1>Get FlowState Pro</h1>' +
      '<p>' + detail + '</p>' +
      '<div class="row"><button class="btn" id="checkout">Open secure checkout</button></div>' +
      '<p class="note">Payment is handled by Paddle. FlowState never sees your card details.</p>';
    document.getElementById("checkout").addEventListener("click", openCheckout);
  }

  function problem(detail) {
    opening = false;
    view.innerHTML = '<h1>Checkout could not open</h1><p>' + detail + '</p>' +
      '<div class="row"><button class="btn" id="again">Try again</button></div>' +
      '<p class="note">If it still will not open, email ' +
      '<a href="mailto:support@flowstatemac.com">support@flowstatemac.com</a>.</p>';
    document.getElementById("again").addEventListener("click", function(){
      location.reload();
    });
  }

  function openCheckout() {
    if (opening) return;
    opening = true;
    try {
      Paddle.Checkout.open({
        items: [{ priceId: "pri_01m12v8xnn38xjj1rt43r1wk29", quantity: 1 }],
        settings: { variant: "one-page" }
      });
    } catch (error) {
      problem("The secure payment window did not load. Nothing has been charged.");
    }
  }

  function checkoutEvent(event) {
    if (!event || !event.name) return;
    if (event.name === "checkout.completed") {
      var transactionId = event.data && event.data.transaction_id;
      // Only a Paddle transaction id may cross into the licence handoff. The webhook still
      // proves payment; this browser value is only the unguessable lookup key for that proof.
      if (typeof transactionId === "string" && /^txn_[a-z0-9]{26}$/.test(transactionId)) {
        var target = new URL("../thanks/", location.href);
        target.searchParams.set("_ptxn", transactionId);
        location.assign(target.href);
      } else {
        problem("Payment completed, but Paddle did not return its transaction reference. " +
          "Nothing has been charged twice.");
      }
      return;
    }
    if (event.name === "checkout.closed") {
      ready("Checkout was closed. You can reopen it when you are ready.");
    } else if (event.name === "checkout.error") {
      problem("Paddle could not start checkout. Nothing has been charged.");
    }
  }

  try {
    if (!window.Paddle) throw new Error("Paddle.js unavailable");
    Paddle.Environment.set("sandbox");
    Paddle.Initialize({
      token: "test_8eda24f230548cfaf2bec6c0aab",
      eventCallback: checkoutEvent
    });
    ready("US$7 per month. Cancel any time.");
    openCheckout();
  } catch (error) {
    problem("The secure payment service did not load. Nothing has been charged.");
  }

  // There is deliberately no static successUrl. It cannot carry Paddle's dynamic
  // transaction id and was the cause of the broken hosted-checkout handoff. If Paddle.js
  // cannot supply checkout.completed, this page fails visibly instead of opening /thanks
  // without the credential that page needs.
})();
</script>
